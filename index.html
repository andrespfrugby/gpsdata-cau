*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink-900);color:var(--text);font-family:Sora,system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Sora,sans-serif;font-weight:600;margin:0;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:208px 1fr;min-height:100vh}
/* El raíl es lo único oscuro de la app: la hoja sigue siendo blanca, como
   un informe. Sirve de ancla para que la pantalla no sea una sábana de cajas
   blancas, y es donde el escudo se ve como se tiene que ver. */
aside{background:var(--cau-tinta);padding:20px 12px 14px;color:#E6E9E8;
  display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
aside .brand{display:flex;align-items:center;gap:11px;padding:0 4px 17px;margin-bottom:12px;
  border-bottom:1px solid rgba(255,255,255,.10)}
/* El balón del escudo, en su versión sobre oscuro. */
aside .brand .mark{width:42px;height:33px;flex:none;background:var(--marca) center/contain no-repeat;
  border-radius:0;font-size:0;color:transparent}
aside .bnom{min-width:0;line-height:1.25}
aside .bnom b{display:block;font-family:Sora;font-weight:600;font-size:13.5px;letter-spacing:-.01em;
  color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
aside .bnom s{display:block;text-decoration:none;font-size:10.5px;color:rgba(255,255,255,.52);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grupoNav{font-size:10px;color:rgba(255,255,255,.42);margin:17px 0 5px;padding:0 10px;
  font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.grupoNav:first-of-type{margin-top:0}
/* El bloque de datos se va abajo del todo, rótulo incluido. */
.grupoNav.fin{margin-top:auto;padding-top:14px}
aside nav{display:flex;flex-direction:column;gap:3px;border:none;padding:0;margin:0;
  overflow:visible;flex:1;min-height:0}
main{min-width:0}
.wrap{max-width:none;margin:0;padding:18px 22px 64px;display:flex;flex-direction:column}
/* El orden de lectura: resumen, ranking, cuadrante, tabla y gráficas. */
#hojaPdf{order:0}#resumen{order:1}#selectores{order:2}#cuadrante{order:3}#tabla{order:4}#paneles{order:5}#notas{order:6}
.hojaPdf{display:none}

header{border-bottom:1px solid var(--ink-700);background:var(--ink-850);position:sticky;top:0;z-index:20}
.ctx{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:15px 22px;flex-wrap:wrap}
.ctrl{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.hd{max-width:1760px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:32px;height:32px;border-radius:8px;background:var(--teal);color:var(--ink-900);display:grid;place-items:center;font-family:Sora;font-weight:700;font-size:13px}
.brand b{font-family:Chivo;font-weight:500;font-size:16px;display:block;line-height:1.2}
.brand span{font-size:12px;color:var(--text-3)}
select,button{font-family:inherit;font-size:13px;color:var(--text);background:var(--ink-800);border:1px solid var(--ink-700);border-radius:var(--r);padding:7px 10px;height:34px}
select:hover,button:hover{border-color:var(--ink-600);cursor:pointer}
select:focus-visible,button:focus-visible,.tab:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.field{display:flex;align-items:center;gap:7px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sand);flex:none}
.dot.live{background:var(--teal)}
#estado{font-size:11px;color:rgba(255,255,255,.55);display:flex;align-items:flex-start;gap:7px;
  padding:12px 6px 0;margin-top:14px;border-top:1px solid rgba(255,255,255,.10);line-height:1.4}
#estado .dot{margin-top:4px}
#estado .ver{color:rgba(255,255,255,.38);font-size:10px}

nav{display:flex;gap:4px;padding:12px 0 0;border-bottom:1px solid var(--ink-700);margin-bottom:22px}
.tab{position:relative;display:flex;align-items:center;gap:10px;background:none;border:none;
  border-radius:9px;height:auto;padding:9px 10px;color:var(--text-2);font-size:13.5px;
  text-align:left;width:100%;transition:background .12s,color .12s}
.tab .ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.tab .et{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
aside .tab{color:rgba(255,255,255,.66)}
aside .tab:hover{background:rgba(255,255,255,.07);border-color:transparent;color:#FFFFFF}
aside .tab[aria-selected=true]{background:rgba(255,255,255,.10);color:#FFFFFF;font-weight:600}
aside .tab[aria-selected=true] .ic{opacity:1}
/* El filete de la izquierda marca dónde estás, en el rojo del club. */
aside .tab[aria-selected=true]::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;
  width:3px;border-radius:0 3px 3px 0;background:var(--cau-rojo)}
.tab:hover{background:var(--ink-800);border-color:transparent;color:var(--text)}
.tab[aria-selected=true]{color:var(--cau-rojo);font-weight:600}
@media (prefers-reduced-motion:reduce){.tab{transition:none}}

.cab{display:block;margin:0}
.cab h2{font-size:22px;display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
.cab .meta{display:block;font-size:12.5px;color:var(--text-3);margin-top:3px}
.md{font-family:Chivo;font-size:12px;letter-spacing:.06em;background:var(--ink-700);color:var(--lav);padding:3px 10px;border-radius:99px}
.md.partido{background:rgba(239,181,185,.16);color:var(--pink)}

.resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
@media(max-width:1000px){.resumen{grid-template-columns:1fr 1fr}}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;
    border-right:none;border-bottom:1px solid var(--ink-700)}
  aside nav{flex-direction:row;flex-wrap:wrap}
  .tab{width:auto}
  .tab.abajo{margin-top:0}
  #estado{border-top:none;padding:0;margin:0}
}
/* El filete de color de la izquierda se va: cinco tarjetas con una banda
   gorda cada una competían entre ellas y con el dato. Lo que distingue
   volumen de intensidad es la palabra, que ya está escrita. */
.kpi{border-radius:12px;padding:13px 16px 11px;background:var(--ink-850);
  box-shadow:0 1px 2px rgba(19,23,21,.05),0 0 0 1px rgba(19,23,21,.05)}
.kpi .k{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-3);font-weight:600}
.kpi b{display:block;font-family:'Chivo Mono';font-weight:600;font-size:34px;line-height:1.1;margin:3px 0 1px}
.kpi b i{font-style:normal;font-size:13px;color:var(--text-3);margin-left:1px}
.kpi .s{font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:7px}
/* "Volumen" e "Intensidad" son etiquetas, no datos: en gris. El color de la
   tarjeta se lo queda la chapa del salto, que es lo único que informa. */
.kpi .s em{font-style:normal;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--text-3);font-weight:600}
.kpi.vol .s em,.kpi.int .s em{color:var(--text-3)}
/* El salto respecto a lo anterior, en una chapa: es lo segundo que se mira
   después del número y antes se perdía entre tres renglones grises. */
.kpi .delta{border-radius:20px;padding:1px 7px;font-size:11px;font-weight:600;
  font-family:'Chivo Mono';letter-spacing:-.02em}
.kpi .delta.sube{background:rgba(31,94,92,.11);color:var(--teal)}
.kpi .delta.baja{background:rgba(168,50,63,.10);color:var(--pink)}
.soloPdf{display:none}
.panel .selMet{width:100%;height:40px;font-size:14px;margin-bottom:11px}
.avgline{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:13px}
.avgline b{font-family:'Chivo Mono';font-weight:600;font-size:30px;color:var(--pink);font-weight:500;letter-spacing:-.01em;vertical-align:-2px;margin-right:4px}
.pie{margin-top:13px;padding-top:11px;border-top:1px solid var(--ink-700)}



.paneles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.paneles{grid-template-columns:1fr}}
/* Sin borde dibujado: una sombra de un pelo y el blanco sobre el gris de la
   mesa ya separan la tarjeta. Veinte recuadros con línea era el ruido. */
.panel{background:var(--ink-850);border-radius:13px;padding:16px 18px;
  box-shadow:0 1px 2px rgba(19,23,21,.05),0 0 0 1px rgba(19,23,21,.06)}
.panel h3{font-size:16px}
.panel .uni{color:var(--text-3);font-size:12px;font-weight:400}
.tit{margin-bottom:14px}
.cajas{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

.tablon{margin-bottom:20px}

@media(max-width:640px){.medallas{grid-template-columns:1fr}}
.medalla{background:var(--ink-850);border-radius:13px;padding:12px 14px;
  box-shadow:0 1px 2px rgba(19,23,21,.05),0 0 0 1px rgba(19,23,21,.06)}
.medalla .cab{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.medalla .ico{font-size:22px;line-height:1}
.medalla .cab b{display:block;font-family:Chivo;font-weight:500;font-size:13px}
.medalla .cab span{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}
.medalla ol{list-style:none;margin:0;padding:0}

.medalla li.porpos{grid-template-columns:52px 1fr auto}
.medalla li.porpos .qui{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3)}
.medalla li .nom2{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.medalla li.vacio{color:var(--text-3);grid-template-columns:1fr}
.panel .sub{font-size:13px;line-height:1.6;color:var(--text-2);margin:2px 0 14px}
.panel .sub b{color:var(--text);font-weight:600}
/* Pie de los KPI: contra cuántas sesiones se compara, o que no hay histórico. */
/* El "vs 5 partidos anteriores" baja de peso: es la letra pequeña del
   porcentaje, no un dato por derecho propio. */
.kpi .vs{display:block;font-size:9px;color:var(--text-3);opacity:.75;margin:3px 0 1px}
.kpi .vs.sola{font-style:italic;margin-top:6px}
/* Chips para marcar las métricas de la matriz. */
.chipsMet{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px;max-height:66px;overflow-y:auto}
.chM{font-size:10.5px;padding:4px 9px;border-radius:6px;background:var(--ink-800);
  border:1px solid var(--ink-600);color:var(--text-3);cursor:pointer;font-family:inherit;white-space:nowrap}
.chM:hover{color:var(--text-2)}
.chM.on{background:rgba(110,154,155,.18);border-color:var(--teal,#6E9A9B);color:var(--text);font-weight:600}
/* Los dos desplegables del scatter. */
/* Los ejes se leen como una frase, no como un formulario: dos palabras que
   se pueden cambiar. Por eso el desplegable no lleva caja, solo un subrayado
   de puntos que dice "esto se toca". */
.ejes{display:flex;align-items:center;gap:6px;margin:1px 0 15px;flex-wrap:wrap;
  font-size:13px;color:var(--text-2)}
.ejes i{font-style:normal;color:var(--text-3)}
.ejes.soloPdf{display:none}
.ejeSel{position:relative;display:inline-flex;align-items:center}
.ejeSel b{font-weight:600;font-size:13.5px;letter-spacing:-.01em;color:var(--text);
  border-bottom:1.5px dashed var(--ink-600);padding:2px 18px 2px 3px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238A9290' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 2px center;background-size:10px;
  transition:color .12s,border-color .12s,background-color .12s}
.ejeSel:hover b{color:var(--teal);border-bottom-color:var(--teal);background-color:rgba(31,94,92,.06)}
.ejeSel:focus-within b{outline:2px solid var(--teal);outline-offset:3px}
/* Invisible pero clicable, estirado sobre la palabra. */
.selEje{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;
  border:none;padding:0;margin:0;font:inherit}
@media (prefers-reduced-motion:reduce){.ejeSel b{transition:none}}
/* Qué vale el 100% de cada línea, en metros y en número. */
.cajas100{display:flex;flex-wrap:wrap;gap:7px;align-items:stretch;margin:0 0 14px}
.t100{width:100%;font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-3);margin-bottom:1px}

.c100 .par{display:flex;align-items:baseline;gap:5px}
.c100 .par b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.c100 .par i{font-style:normal;font-size:9.5px;color:var(--text-3)}
/* El aviso de qué no mide el gráfico. */

/* gráfica de evolución: barras de % BiP con la métrica encima */

/* ---- Podio de la sesión y promedios en cinco ---- */
.medallas{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:10px}
@media(max-width:620px){.medallas{grid-template-columns:repeat(2,1fr)}}
.medalla{background:var(--ink-850);border:1px solid var(--ink-700);border-radius:10px;padding:8px 9px;
  display:flex;flex-direction:column;min-width:0;overflow:hidden}
.medalla .top{display:flex;align-items:center;gap:8px;margin-bottom:5px;min-height:30px}
.medalla .ico{font-size:22px;line-height:1;width:25px;text-align:center;flex:none}
.medalla .tit{min-width:0}
.medalla .tit b{display:block;font-size:10.5px;font-weight:600;line-height:1.22;letter-spacing:-.01em}
.medalla ol{list-style:none;margin:auto 0 0;padding:0}
/* Cada puesto es una fila: medalla, nombre, barra recta con el color de su
   línea y el dato. La barra es la que deja comparar de un vistazo. */
/* Las tres columnas miden lo mismo: entre oro, plata y bronce cambian la
   medalla y el color, nada más. La cara es igual de grande para los tres. */
.medalla .podio{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;align-items:stretch}
/* El texto se alinea abajo en las tres: el oro tiene la foto más grande y si
   no, su nombre caería un dedo por debajo del de plata y bronce. */
.medalla .pod{--av:80px;position:relative;text-align:center;border-radius:9px;padding:9px 4px 7px;
  border:1px solid transparent;min-width:0;display:flex;flex-direction:column}
.medalla .pod .n{margin-top:auto}
/* Oro, plata y bronce. El metal es lo único que cambia entre las tres, así que
   lleva el peso de distinguirlas: fondo, borde y el color del número. */
.medalla .pod.oro{background:#FBF5E3;border-color:#E6D099}
.medalla .pod.plata{background:#F2F4F5;border-color:#D3DADD}
.medalla .pod.bronce{background:#F9F0E8;border-color:#E3C7AC}
.medalla .pod.oro .v{color:#8A6A12}
.medalla .pod.plata .v{color:#5E6A70}
.medalla .pod.bronce .v{color:#9A5F2E}
/* Prendida en el borde de la foto, como una chapa de dorsal. El emoji de
   medalla a 13 px era una mancha; el número en el color del metal se lee
   siempre, también impreso en pequeño. */
.medalla .pod .insig{position:absolute;top:calc(9px + var(--av) * .68);left:calc(50% + var(--av) * .19);
  width:22px;height:22px;display:grid;place-items:center;line-height:1;
  font-family:'Chivo Mono';font-size:12px;font-weight:700;color:#fff;
  border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.medalla .pod.oro .insig{background:#B8923A}
.medalla .pod.plata .insig{background:#8D989E}
.medalla .pod.bronce .insig{background:#A3703F}
.medalla .pod .n{display:block;font-size:11px;font-weight:600;line-height:1.2;margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.medalla .pod .v{display:block;font-family:'Chivo Mono';font-size:18px;font-weight:700;
  letter-spacing:-.03em;line-height:1.2}
.medalla .pod .p{display:block;font-family:'Chivo Mono';font-size:9px;letter-spacing:-.02em;
  color:var(--text-3);white-space:nowrap}
/* Por encima de 100 es récord suyo: pasa a ocupar su propio renglón en negrita
   con una flecha, porque "ha superado su techo" es otra cosa que "va al 92%". */
.medalla .pod .p.medio{color:var(--text-2)}
.medalla .pod .p.alto{color:var(--sand);font-weight:600}
.medalla .pod .p.tope{color:var(--teal);font-weight:700}
.medalla .pod .p.record{color:var(--teal);font-weight:700}
.medalla .pod .p.record::before,.medalla li .suyo.record::before{content:"▲ "}
.medalla li .suyo.record{color:var(--teal);font-weight:700}
/* La cara. Sin foto todavía, las iniciales con el color de su línea: un hueco
   gris en el podio canta más que unas iniciales. */
/* El tamaño lo hereda del contenedor: aquí NO se declara --av, que si no
   se pisaría a sí mismo y el podio no podría agrandarlo. */
.av{display:block;width:var(--av,44px);height:var(--av,44px);margin:0 auto;border-radius:50%;
  object-fit:cover;background:var(--ink-700);border:2px solid #fff;
  box-shadow:0 1px 3px rgba(0,0,0,.14);box-sizing:border-box;flex:none}
.av.ini{display:grid;place-items:center;font-weight:700;color:var(--text-2);letter-spacing:-.02em;
  font-size:calc(var(--av, 44px) * .34)}
/* La foto manda en el podio, así que se le da sitio de verdad. En pantallas
   estrechas encoge sola, que si no se come la tarjeta entera. */
@media(max-width:1340px){.medalla .pod{--av:64px}}
@media(max-width:1120px){.medalla .pod{--av:52px}
  .medalla .pod .insig{width:18px;height:18px;font-size:10px}}
.fjug .av{--av:46px}
/* Del cuarto para abajo: fila fina, sin barra. Quien gana ya está arriba. */
.medalla ol.resto{margin-top:6px}
.medalla li{display:grid;grid-template-columns:16px minmax(20px,1fr) auto 32px;
  align-items:center;gap:6px;padding:3px 0;font-size:12px}
.medalla li+li{border-top:1px solid var(--ink-800)}
.medalla li .pos{text-align:center}
.medalla li .pos em{font-style:normal;font-family:'Chivo Mono';font-size:9.5px;color:var(--text-3)}
.medalla li .qui{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.medalla li .val{font-family:'Chivo Mono';color:var(--text);font-size:11.5px;letter-spacing:-.02em;
  text-align:right;white-space:nowrap}
.medalla .uniR{margin-left:auto;font-size:9px;color:var(--text-3);flex:none}
/* El % de su propia mejor marca. Aquí sí tiene sentido el color: no dice si
   el dato es bueno o malo, dice cuánto le queda a cada una para su techo. */
.medalla li .suyo{font-family:'Chivo Mono';font-size:10.5px;letter-spacing:-.02em;
  text-align:right;white-space:nowrap;color:var(--text-3)}
.medalla li .suyo.medio{color:var(--text-2)}
.medalla li .suyo.alto{color:var(--sand);font-weight:600}
.medalla li .suyo.tope{color:var(--teal);font-weight:700}
/* Sin la columna del %, la fila recupera ese hueco en vez de dejarlo vacío. */
.medalla.sinMax li{grid-template-columns:16px minmax(20px,1fr) auto}
.larga{display:inline}.corta{display:none}
@media(max-width:1280px){.larga{display:none}.corta{display:inline}}

.resumen.cinco{grid-template-columns:repeat(5,1fr);gap:8px;padding:11px 12px}
@media(max-width:620px){.resumen.cinco{grid-template-columns:repeat(2,1fr)}}
.resumen.cinco .kpi{padding:8px 10px;min-width:0;overflow:hidden;border-radius:9px}
.resumen.cinco .kpi .k{font-size:9px;letter-spacing:.1em;color:var(--text-2);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.resumen.cinco .kpi b{font-size:21px;letter-spacing:-.025em;white-space:nowrap;margin:1px 0}
.resumen.cinco .kpi b i{font-size:11px}
.resumen.cinco .kpi .s{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resumen.cinco .kpi .s em{font-style:normal;color:var(--text-3)}
.resumen.cinco .kpi.int .s em{color:var(--text-3)}

/* ---- Semáforo, alertas e iconos de la tabla ---- */
table.datos td.n{text-align:center}
table.datos th.n{text-align:center}
.icoMejor{font-size:18px;margin-left:6px;vertical-align:-4px}
/* Marcas personales batidas en la sesión. */
.records{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 12px}
/* Marca personal batida: rayo, aro lleno y el salto respecto a su registro. */
.med{display:flex;align-items:center;gap:11px;background:rgba(240,225,153,.09);
  border:1px solid rgba(240,225,153,.32);border-radius:11px;padding:8px 15px 8px 12px}
/* El emoji y el aro, apilados en su columna; la cara al lado, que es lo que
   se mira primero. */
.med .marca{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none}
.med .ico{font-size:19px;line-height:1}
.med .rosco{width:30px;height:30px;flex:none}
.med .av{--av:46px}
.med .txt s{display:block;text-decoration:none;font-size:9px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--sand,#F0E199);font-weight:600}
.med .txt b{display:block;font-size:13px;line-height:1.3}
.med .txt u{text-decoration:none;font-family:'Chivo Mono';font-weight:600;font-size:15px;letter-spacing:-.02em}
.med .txt u i{font-style:normal;font-size:10px;color:var(--text-3);margin-left:2px;font-family:Sora}
.med .txt em{font-style:normal;display:block;font-size:10px;color:var(--text-3);margin-top:1px}
.med .sube{color:#1F5E5C;font-weight:600}
/* El % de exposición, dibujado en la celda. */
.rosco{width:30px;height:30px;display:block;margin:0 auto}
.leyAro{align-items:center}
.leyAro .rosco{width:22px;height:22px;margin:0 6px 0 0}
td.anillo{padding-top:2px;padding-bottom:2px}
.alertaG{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;
  background:var(--sand);color:#FFFFFF;font-size:10px;font-weight:700;margin-left:5px;
  cursor:help;vertical-align:-3px;line-height:1}
.leyTabla{display:flex;gap:15px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--text-3);
  margin-top:12px;padding-top:10px;border-top:1px solid var(--ink-800)}
.leyTabla i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.leyTabla i.sw.verde{background:rgba(110,154,155,.45)}
.leyTabla b{color:var(--text-2)}
.leyPaneles{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:11px;
  color:var(--text-3);margin-top:2px}
.leyPaneles i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.leyPaneles i.raya{width:2px;height:11px;border-radius:0;background:var(--pink)}

/* ---- Paneles de columnas agrupadas por línea ---- */
.paneles{grid-template-columns:1fr}
.panel .cajasMedia{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
.cm{background:var(--ink-800);border-left:3px solid var(--ink-600);border-radius:8px;padding:6px 12px;min-width:102px}
.cm span{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3)}
.cm b{font-family:'Chivo Mono';font-size:16px;letter-spacing:-.02em;font-weight:600;display:block;line-height:1.25}
.cm.eq{background:rgba(239,181,185,.14);border:1px solid rgba(239,181,185,.3);border-left:1px solid rgba(239,181,185,.3)}
.cm.eq b{color:var(--pink);font-size:20px}
svg.cols{width:100%;height:auto;display:block}
svg.cols text{font-family:Sora,system-ui,sans-serif}
.leyPaneles{grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--text-3);margin-top:2px}

/* ---- Minigráfico en las cajas de promedio ---- */
.resumen.cinco .kpi .chispa{display:block;width:100%;height:32px;margin-top:5px}
.delta{font-family:'Chivo Mono';font-size:10.5px;margin-left:6px}
.delta.sube{color:var(--teal)}
.delta.baja{color:var(--pink)}
.enlace{background:none;border:none;padding:0;height:auto;color:var(--teal);font-size:12px;
  text-decoration:underline;cursor:pointer;font-family:inherit}
.enlace:hover{color:var(--text)}

/* ---- Comentarios escritos a mano ---- */
.panel.comentarios{margin-top:16px}
.coment{min-height:84px;background:var(--ink-800);border:1px solid var(--ink-700);border-radius:10px;
  padding:11px 14px;font-size:14px;line-height:1.6;white-space:pre-wrap;outline:none}
.coment:focus{border-color:var(--teal)}
.coment:empty:before{content:attr(data-vacio);color:var(--text-3)}

/* ---- Informe de varias métricas del jugador ---- */
.chipsJug{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:-8px 0 16px}
.chipsJug .et{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
.chipsJug .chip{background:var(--ink-800);border:1px solid var(--ink-700);border-radius:99px;
  height:28px;padding:0 12px;font-size:12.5px;color:var(--text-2);cursor:pointer;font-family:inherit}
.chipsJug .chip:hover{border-color:var(--teal);color:var(--text)}
.chipsJug .chip i{font-style:normal;color:var(--text-3);margin-left:4px}
#jMas{max-width:210px}

.resumen .kpi svg.disp{display:block;width:100%;height:20px;margin-top:9px;color:var(--teal)}
.resumen .kpi.int svg.disp{color:var(--lav)}
.panel.bipReporte .celdas{margin-bottom:4px}

/* ---------- barra de referencia, criterios y tooltip ---------- */
.barraRef{background:var(--ink-850);border:1px solid var(--ink-700);border-radius:13px;
  padding:13px 15px;margin:0 0 16px}
.filaRef{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.campoR label{display:block;font-size:10.5px;color:var(--text-2);margin-bottom:5px}
.campoR select{height:38px}
.segR{display:flex;background:var(--ink-800);border:1px solid var(--ink-700);border-radius:9px;padding:3px;gap:2px}
.segR button{background:none;border:0;border-radius:7px;padding:7px 12px;height:auto;
  font-size:12.5px;color:var(--text-2)}
.segR button:hover{background:var(--ink-700);border-color:transparent}
.segR button.on{background:var(--text);color:var(--ink-850);font-weight:600}
.objR{display:flex;align-items:center;gap:6px;background:var(--ink-800);
  border:1px solid var(--ink-700);border-radius:9px;padding:0 12px;height:38px}
.objR input{width:48px;background:none;border:0;color:var(--text);font-family:inherit;
  font-size:16px;font-weight:600;text-align:right;padding:0;height:auto;
  font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.objR input::-webkit-outer-spin-button,.objR input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.objR span{color:var(--text-2);font-size:13px}
.ruedaR{margin-left:auto;width:38px;height:38px;font-size:16px;color:var(--text-2);
  background:var(--ink-800);border:1px solid var(--ink-700);border-radius:9px;padding:0}
.ruedaR.on{border-color:var(--teal);color:var(--teal);background:rgba(31,94,92,.08)}
.ajustesR{margin-top:14px;border-top:1px solid var(--ink-700);padding-top:15px}
.gridR{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px}
.blqR h4{font-size:11.5px;margin:0 0 9px;font-weight:600}
.filaC{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:4px 0;font-size:12.5px;color:var(--text-2)}
.filaC input[type=number]{width:62px;text-align:right;height:30px;padding:3px 8px}
.filaC select{height:30px;padding:3px 8px;font-size:12.5px}
.notaR{color:var(--text-2);font-size:11.5px;line-height:1.5;margin:9px 0 0;max-width:46ch}
.cascadaR{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:16px 0 0}
.pasoR{border:1px solid var(--ink-700);border-radius:10px;padding:8px 13px;background:var(--ink-800)}
.pasoR b{display:block;font-size:12.5px}
.pasoR s{text-decoration:none;display:block;color:var(--text-3);font-size:10.5px}
.pasoR.act{border-color:var(--teal);background:rgba(31,94,92,.08)}
.fleR{color:var(--text-3);font-size:15px}

.selloR{display:inline-block;font-size:9.5px;padding:2px 6px;border-radius:5px;
  margin-left:7px;font-weight:600;vertical-align:1px;white-space:nowrap}
.selloR.s-jug{background:rgba(31,94,92,.14);color:var(--teal)}
.selloR.s-pos{background:rgba(154,107,18,.16);color:var(--sand)}
.selloR.s-eq{background:rgba(168,50,63,.12);color:var(--pink)}
table.datos.ref tr.grupoRef td{padding:16px 0 5px 10px;font-size:11px;font-weight:600;
  letter-spacing:.03em;border-bottom:2px solid currentColor;background:none}
table.datos.ref td.nomR{white-space:nowrap}
table.datos.ref td.n.llega{font-weight:700}
table.datos.ref td.n.flojo{color:var(--text-3)}
table.datos.ref td[data-tip]{cursor:help}

.tipRef{position:absolute;z-index:60;width:266px;background:var(--text);color:#fff;
  border-radius:11px;padding:11px 13px;font-size:12px;line-height:1.5;
  box-shadow:0 10px 28px rgba(0,0,0,.22);pointer-events:none}
.tipRef h5{margin:0 0 7px;font-size:12.5px;font-weight:600;color:#fff}
.tipRef .tr{display:flex;justify-content:space-between;gap:12px;padding:2.5px 0;color:#C9D2D0}
.tipRef .tr b{color:#fff;font-variant-numeric:tabular-nums}
.tipRef .pieT{margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.17);
  color:#A9B3B1;font-size:11px}

.notaEv{font-size:11.5px;color:var(--text-2);line-height:1.6;margin:12px 0 0;
  padding-top:11px;border-top:1px solid var(--linea,var(--ink-700))}
.notaEv b{color:var(--text)}
.listaEv{max-height:188px;overflow:auto;border:1px solid var(--ink-700);border-radius:9px;
  padding:4px 6px;background:var(--ink-850)}
.evR{display:flex;align-items:center;gap:8px;padding:4px 4px;font-size:12px;cursor:pointer;border-radius:6px}
.evR:hover{background:var(--ink-800)}
.evR input{width:14px;height:14px;accent-color:var(--teal);flex:none;margin:0}
.evR span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evR s{text-decoration:none;color:var(--text-3);font-size:10.5px;flex:none}
.campoR .bot{height:38px}

.ref100{font-size:11.5px;color:var(--text-2);margin:2px 0 14px;display:flex;flex-wrap:wrap;
  gap:4px 16px;align-items:baseline}
.ref100 span{display:inline-flex;align-items:baseline;gap:5px}
.ref100 i{width:8px;height:8px;border-radius:2px;display:inline-block;align-self:center}
.ref100 b{color:var(--text);font-weight:600}

.leyCuad{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));
  gap:16px;margin:16px 0 0}
.leyCuad>div{padding-top:9px}
.leyCuad b{display:block;font-size:11.5px;font-weight:700;letter-spacing:.02em;margin-bottom:5px}
.leyCuad span{display:block;font-size:11.5px;color:var(--text-2);line-height:1.5}
.leyCuad i{display:block;font-style:normal;font-size:11.5px;color:var(--text);font-weight:600;margin-top:4px}

/* ---------- reporte de un partido ---------- */
.repBip{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:14px;align-items:start}
.repCol{display:grid;gap:12px;min-width:0}
.repLat{display:grid;gap:12px;min-width:0}
.repLat .panel{margin:0;padding:12px 14px}
.repLat .panel h3{font-size:12.5px;margin-bottom:6px}
@media (max-width:1100px){.repBip{grid-template-columns:1fr}
  .repLat{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}}

.blq{background:var(--ink-850);border:1px solid var(--ink-700);border-radius:12px;overflow:hidden}
.blq>h4{margin:0;padding:9px 14px;font-size:12px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:#fff}
.blq>h4.cab1{background:#343C8A}
.blq>h4.cab2{background:#2F615C}
.blq>h4.cab3{background:#A8323F}
.blq .scroll{padding:0 12px 12px}
.blq table.datos{margin-top:2px}

.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,118px),1fr));
  gap:1px;background:var(--ink-700);border-bottom:1px solid var(--ink-700)}
.cifras>div{background:var(--ink-850);padding:9px 12px 10px;min-width:0}
.cifras span{display:block;font-size:10px;color:var(--text-2);line-height:1.25;
  margin-bottom:3px;min-height:2.5em}
.cifras b{font-size:20px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.cifras .dest{background:rgba(47,97,92,.07)}
.cifras .dest b{color:var(--teal)}

table.tramos{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed}
table.tramos th{font-size:10.5px;font-weight:600;color:#fff;padding:5px 2px;border-radius:5px;
  text-align:center;white-space:nowrap}
table.tramos td{text-align:center;border-radius:5px;padding:7px 2px;font-variant-numeric:tabular-nums}
table.tramos td.cnt{font-size:20px;font-weight:600}
table.tramos td.pct{font-size:11.5px;font-weight:600}
table.datos.bip td.nm{text-align:left;white-space:nowrap}
table.datos.bip td.nm i{font-style:normal;color:var(--text-3);font-size:11px}
table.datos.bip td.fuerte{font-weight:700}

/* ---------- panel de temporada de balón en juego ---------- */
.chipsP{display:flex;flex-wrap:wrap;gap:6px}
.chipP{border:1px solid var(--ink-700);background:var(--ink-850);color:var(--text);
  border-radius:999px;padding:7px 12px;height:auto;font-size:12.5px;display:flex;align-items:center;gap:5px}
.chipP b{font-weight:700;color:var(--text-3);font-size:12px}
.chipP.on{background:var(--pink);border-color:var(--pink);color:#fff}
.chipP.on b{color:rgba(255,255,255,.75)}
.dosBip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:14px;margin-top:14px}
.dosBip>.panel{margin:0}
table.semBip{width:100%;border-collapse:separate;border-spacing:5px;font-variant-numeric:tabular-nums}
table.semBip th{font-size:11.5px;color:var(--text-2);font-weight:500;padding:0 0 2px}
table.semBip td{text-align:center;border-radius:7px;padding:6px 2px;line-height:1.05}
table.semBip td b{display:block;font-size:19px;font-weight:600}
table.semBip td span{font-size:11px;font-weight:600;color:var(--text-2)}
table.semBip td.nm{text-align:left;font-weight:600;white-space:nowrap;padding-left:2px;font-size:12.5px;background:none}
table.semBip td.nm small{display:block;color:var(--text-3);font-weight:400;font-size:10.5px}
table.semBip tr.tot td:not(.nm){box-shadow:inset 0 0 0 2px var(--text)}
table.semBip tr.dim td{opacity:.35}
table.semBip tr.sel td.nm{color:var(--pink)}
.seqsBip{display:grid;gap:7px;margin-top:4px}
.sqBip{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:end}
.sqBip .nq{font-weight:600;font-size:12.5px;padding-bottom:4px}
.sqBip .nq small{display:block;color:var(--text-3);font-weight:400;font-size:10.5px}
.sqBip .gq{min-width:0}
@media (max-width:760px){.sqBip{grid-template-columns:1fr}.sqBip .nq{padding:0}}

@media print{
  @page{margin:9mm;size:landscape}
  *{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  body{background:#fff;color:#111;font-size:12px}
  header,nav,aside,.selectores,.leyenda{display:none}
  .app{display:block}
  .soloPdf{display:block;font-size:13px;margin-bottom:6px;color:#111}
  /* La cabecera del papel: escudo, de qué sesión es y de quién. */
  .hojaPdf{display:flex;align-items:center;gap:11px;padding:0 0 8px;margin-bottom:10px;
    border-bottom:2px solid #121413}
  .hojaPdf .esc{width:34px;height:48px;flex:none;
    background:var(--escudo) center/contain no-repeat}
  .hojaPdf b{display:block;font-family:Sora;font-size:15px;font-weight:600;color:#111;line-height:1.25}
  .hojaPdf span{display:block;font-size:11px;color:#4A5150}
  .hojaPdf .club{margin-left:auto;text-align:right;font-size:10px;color:#6B7384;
    text-transform:uppercase;letter-spacing:.1em}
  /* las cajas de arriba pierden el degradado, que en papel sale casi negro */

  table.datos td.pos{color:#555}

  .paneles{grid-template-columns:1fr;gap:7px;align-items:start}

  svg.cols rect.fondoGrupo[fill="#2A1A20"]{fill:#FBEEF0}

/* ---- Fotos de jugadores ---- */
.fotos{background:var(--ink-850);border:1px solid var(--ink-700);border-radius:14px;

.fotos{grid-column:1/-1}

  transition:border-color .15s,background .15s}

  padding:1px 4px;border-radius:3px}

  letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtn{flex:none;background:none;border:1px solid var(--ink-600);border-radius:7px;color:var(--text-2);
  font:inherit;font-size:11px;padding:4px 8px;cursor:pointer}

.capa{position:fixed;inset:0;background:rgba(19,23,21,.55);display:grid;place-items:center;

  <main>
    <header>
      <div class="ctx">
        <div class="cab" id="cab"></div>
        <div class="ctrl">
          <div class="field"><label for="fSquad">Equipo</label><select id="fSquad"></select></div>

          <button id="btnPdf">Exportar PDF</button>
        </div>
      </div>
    </header>
    <div class="wrap">
      <!-- Cabecera solo para el papel: en pantalla ya está la de arriba, pero

      <div id="resumen"></div>
      <div class="selectores" id="selectores"></div>
      <div id="cuadrante"></div>
      <div class="paneles" id="paneles"></div>
      <div id="tabla"></div>
      <div id="notas"></div>

  </main>
</div>

    <input type="range" id="zoomRecorte" min="100" max="400" value="100" aria-label="Acercar">

  </div>
