<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAU · Reporte de sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Chivo+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink-900:#0E1524; --ink-850:#151F33; --ink-800:#1B263B; --ink-700:#26344F; --ink-600:#33445F;
  --teal:#6E9A9B; --pink:#EFB5B9; --lav:#A0A7D8; --purple:#C7B8E7; --peach:#F5C4AF; --sand:#F0E199; --red:#E63946;
  --text:#E9EEF7; --text-2:#9EABC2; --text-3:#6B7A94;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink-900);color:var(--text);font-family:Sora,system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Sora,sans-serif;font-weight:600;margin:0;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:170px 1fr;min-height:100vh}
aside{background:var(--ink-850);border-right:1px solid var(--ink-700);padding:16px 11px;
  display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh}
aside .brand{display:flex;align-items:center;gap:9px;padding:0 5px;margin-bottom:16px}
aside .brand b{font-family:Sora;font-weight:600;font-size:15px}
aside nav{display:flex;flex-direction:column;gap:3px;border:none;padding:0;margin:0;overflow:visible}
main{min-width:0}
.wrap{max-width:none;margin:0;padding:18px 22px 64px}

header{border-bottom:1px solid var(--ink-700);background:var(--ink-850);position:sticky;top:0;z-index:20}
.ctx{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:15px 22px;flex-wrap:wrap}
.ctrl{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.hd{max-width:1760px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:32px;height:32px;border-radius:8px;background:var(--teal);color:var(--ink-900);display:grid;place-items:center;font-family:Sora;font-weight:700;font-size:13px}
.brand b{font-family:Chivo;font-weight:500;font-size:16px;display:block;line-height:1.2}
.brand span{font-size:12px;color:var(--text-3)}
select,button{font-family:inherit;font-size:13px;color:var(--text);background:var(--ink-800);border:1px solid var(--ink-700);border-radius:var(--r);padding:7px 10px;height:34px}
select:hover,button:hover{border-color:var(--ink-600);cursor:pointer}
select:focus-visible,button:focus-visible,.tab:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.field{display:flex;align-items:center;gap:7px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sand);flex:none}
.dot.live{background:var(--teal)}
#estado{font-size:11px;color:var(--text-3);display:flex;align-items:center;gap:7px;
  padding:11px 5px 0;margin-top:10px;border-top:1px solid var(--ink-700);line-height:1.35}

nav{display:flex;gap:4px;padding:12px 0 0;border-bottom:1px solid var(--ink-700);margin-bottom:22px}
.tab{background:none;border:none;border-radius:8px;height:auto;padding:9px 12px;color:var(--text-3);
  font-size:13.5px;text-align:left;width:100%}
.tab:hover{background:var(--ink-800);border-color:transparent}
.tab[aria-selected=true]{background:var(--ink-700);color:var(--text);font-weight:500}
.tab.abajo{margin-top:auto}

.cab{display:block;margin:0}
.cab h2{font-size:22px;display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
.cab .meta{display:block;font-size:12.5px;color:var(--text-3);margin-top:3px}
.md{font-family:Chivo;font-size:12px;letter-spacing:.06em;background:var(--ink-700);color:var(--lav);padding:3px 10px;border-radius:99px}
.md.partido{background:rgba(239,181,185,.16);color:var(--pink)}

.resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
@media(max-width:1000px){.resumen{grid-template-columns:1fr 1fr}}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;
    border-right:none;border-bottom:1px solid var(--ink-700)}
  aside nav{flex-direction:row;flex-wrap:wrap}
  .tab{width:auto}
  .tab.abajo{margin-top:0}
  #estado{border-top:none;padding:0;margin:0}
}
.kpi{border-radius:12px;padding:12px 15px;background:var(--ink-850);border:1px solid var(--ink-700);
  border-left:3px solid var(--teal)}
.kpi.int{border-left-color:var(--lav)}
.kpi .k{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-2)}
.kpi b{display:block;font-family:'Chivo Mono';font-weight:600;font-size:36px;line-height:1.15;margin:2px 0}
.kpi b i{font-style:normal;font-size:14px;color:var(--text-2)}
.kpi .s{font-size:12px;color:var(--text-3)}
.soloPdf{display:none}
.panel .selMet{width:100%;height:40px;font-size:14px;margin-bottom:11px}
.avgline{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:13px}
.avgline b{font-family:'Chivo Mono';font-weight:600;font-size:30px;color:var(--pink);font-weight:500;letter-spacing:-.01em;vertical-align:-2px;margin-right:4px}
.pie{margin-top:13px;padding-top:11px;border-top:1px solid var(--ink-700)}



.paneles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.paneles{grid-template-columns:1fr}}
.panel{background:var(--ink-850);border:1px solid var(--ink-700);border-radius:12px;padding:16px 18px}
.panel h3{font-size:16px}
.panel .uni{color:var(--text-3);font-size:12px;font-weight:400}
.tit{margin-bottom:14px}
.cajas{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.caja{display:inline-flex;align-items:baseline;gap:6px;background:var(--ink-800);border:1px solid var(--ink-700);
  border-radius:99px;padding:4px 11px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
.caja b{font-family:'Chivo Mono';font-weight:500;font-size:14px;color:var(--text-2);letter-spacing:-.01em}
.caja.destacada b{font-size:17px;color:var(--pink)}
.caja.destacada{background:rgba(239,181,185,.14);border-color:rgba(239,181,185,.3)}
.caja.destacada b{color:var(--pink)}
.fila{display:grid;grid-template-columns:118px 1fr 80px;align-items:center;gap:11px;padding:5px 0}
.fila .nom{font-size:15.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pista{position:relative;height:24px;background:var(--ink-800);border-radius:5px}
.pista i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);border-radius:4px}
.pista i{background:var(--lav)}
.pista i.cumple{background:var(--teal)}
.pista u{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--pink);text-decoration:none}
.fila .val{font-family:'Chivo Mono';font-size:15px;text-align:right;color:var(--text)}
.fila:hover .nom{color:var(--text)}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-3);margin-top:12px;padding-top:10px;border-top:1px solid var(--ink-800)}
.leyenda span{display:flex;align-items:center;gap:6px}
.sw{width:9px;height:9px;border-radius:2px;display:inline-block}
.tablon{margin-bottom:20px}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.conmuta{display:flex;gap:4px;background:var(--ink-800);border-radius:99px;padding:3px}
.mini{background:none;border:none;border-radius:99px;height:28px;padding:0 14px;font-size:12px;color:var(--text-3)}
.mini.on{background:var(--ink-700);color:var(--text)}
.medallas{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:1200px){.medallas{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.medallas{grid-template-columns:1fr}}
.medalla{background:var(--ink-800);border-radius:12px;padding:12px 14px}
.medalla .cab{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.medalla .ico{font-size:22px;line-height:1}
.medalla .cab b{display:block;font-family:Chivo;font-weight:500;font-size:13px}
.medalla .cab span{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}
.medalla ol{list-style:none;margin:0;padding:0}
.medalla li{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.medalla li + li{border-top:1px solid var(--ink-700)}
.medalla li .pos{font-family:Chivo;font-size:11px;color:var(--ink-900);background:var(--ink-600);
  width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.medalla li.p1 .pos{background:var(--sand)}
.medalla li.p2 .pos{background:var(--text-2)}
.medalla li.p3 .pos{background:var(--peach)}
.medalla li .qui{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.medalla li.p1 .qui{color:var(--text)}
.medalla li .val{font-family:'Chivo Mono';color:var(--text)}
.medalla li.porpos{grid-template-columns:52px 1fr auto}
.medalla li.porpos .qui{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3)}
.medalla li .nom2{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.medalla li.vacio{color:var(--text-3);grid-template-columns:1fr}
.panel .sub{font-size:12px;color:var(--text-3);margin:2px 0 14px}
.scroll{overflow-x:auto}
table.datos{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap}
table.datos th{font-weight:400;font-size:12px;color:var(--text-3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--ink-700)}
table.datos th.grupo{text-align:center;color:var(--lav);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--ink-600)}
table.datos th.n{text-align:right}
table.datos td{padding:6px 8px;border-bottom:1px solid var(--ink-800)}
table.datos td.n{text-align:right;font-family:'Chivo Mono'}
table.datos td.pos{color:var(--text-3)}
table.datos tbody tr:hover{background:var(--ink-800)}
table.datos tbody tr.corte td{border-top:1px solid var(--ink-700)}
table.datos.carga td.n i{display:block;font-style:normal;font-size:10.5px;color:var(--text-3);margin-top:2px}
table.datos.carga tfoot tr.media td{border-top:1px solid var(--ink-600);background:rgba(160,167,216,.06);color:var(--lav)}
table.datos.acwrtabla th.col{cursor:pointer}
table.datos.acwrtabla th.col:hover{color:var(--text)}
table.datos td.acwr{font-weight:600}
table.datos td.acwr.alta{color:#F08A90}
table.datos td.acwr.ok{color:var(--teal)}
table.datos td.acwr.baja{color:var(--lav)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px}
.tag.alta{background:rgba(230,57,70,.16);color:#F08A90}
.tag.ok{background:rgba(110,154,155,.18);color:var(--teal)}
.tag.baja{background:rgba(160,167,216,.16);color:var(--lav)}
.tag.na{background:var(--ink-800);color:var(--text-3)}
td.chispa{display:flex;align-items:flex-end;gap:2px;height:34px;padding-top:12px}
td.chispa i{width:9px;background:var(--ink-600);border-radius:2px;display:block}
td.chispa i.ult{background:var(--teal)}
table.datos th.orden{cursor:pointer;user-select:none}
table.datos th.orden:hover{color:var(--text)}
table.datos.drills td{padding:9px 10px}
table.datos.drills tfoot tr.media td{border-top:1px solid var(--ink-600);background:rgba(160,167,216,.10);color:var(--lav)}
table.datos.drills tfoot .nomb{color:var(--text)}
table.datos.drills tfoot tr.tipico td{background:rgba(110,154,155,.10);color:var(--teal);border-top:none}
table.datos.drills tfoot tr.dif td{background:var(--ink-800);color:var(--text-2);border-top:none}
table.datos.drills .nomb{font-size:14px}
table.datos.drills .dur{display:flex;align-items:center;gap:7px;margin-top:4px}
table.datos.drills .dur i{height:4px;background:var(--ink-600);border-radius:2px;display:block}
table.datos.drills .dur span{font-size:10.5px;color:var(--text-3)}
table.datos td.n.verde{color:var(--teal);font-weight:500}
table.datos td.n.lider{font-weight:700;color:var(--text)}
table.datos tfoot tr.media td{border-top:1px solid var(--ink-600);border-bottom:none;color:var(--lav);background:rgba(160,167,216,.06)}
table.datos tfoot tr.media.global td{color:var(--text);background:rgba(160,167,216,.14);font-weight:500}
.empty{padding:36px 20px;text-align:center;color:var(--text-3);font-size:13px;grid-column:1/-1}

.solo{grid-column:1/-1;max-width:720px}
.zona{border:2px dashed var(--ink-700);border-radius:14px;padding:38px 24px;text-align:center;background:var(--ink-850);transition:border-color .15s,background .15s}
.zona.encima{border-color:var(--teal);background:var(--ink-800)}
.zona h3{font-size:16px;margin-bottom:6px}
.zona p{font-size:13px;color:var(--text-3);margin:0 0 18px}
.zona button{background:var(--teal);border-color:var(--teal);color:var(--ink-900);height:38px;padding:0 18px;font-weight:500}
.resumen{margin-top:18px;background:var(--ink-850);border:1px solid var(--ink-700);border-radius:12px;padding:16px 18px}
.resumen dl{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:0;font-size:13px}
.resumen dt{color:var(--text-2)}
.resumen dd{margin:0;font-family:'Chivo Mono';text-align:right}
.aviso{margin-top:14px;padding:10px 14px;border-radius:10px;font-size:13px}
.aviso.ok{background:rgba(110,154,155,.14);color:var(--teal)}
.aviso.error{background:rgba(230,57,70,.14);color:#F08A90}
.aviso.espera{background:var(--ink-800);color:var(--text-2)}
.pasos{font-size:13px;color:var(--text-3);margin-top:16px;line-height:1.7}
/* ---- BiP ---- */
.bip .secc{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--teal);margin:22px 0 9px;font-weight:600}
.bip .secc:first-of-type{margin-top:0}
.celdas{display:grid;gap:8px;margin-bottom:16px}
.celdas.seis{grid-template-columns:repeat(6,1fr)}
.celdas.cinco{grid-template-columns:repeat(5,1fr)}
.celdas.cuatro{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.celdas.seis,.celdas.cinco,.celdas.cuatro{grid-template-columns:repeat(3,1fr)}}
.c{background:var(--ink-850);border:1px solid var(--ink-700);border-radius:10px;padding:10px 12px}
.c.dest{background:linear-gradient(180deg,rgba(110,154,155,.18),rgba(110,154,155,.04));border-color:rgba(110,154,155,.4)}
.c span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);margin-bottom:3px}
.c b{font-family:'Chivo Mono';font-weight:600;font-size:23px;line-height:1.1}
.c b i{font-style:normal;font-size:13px;color:var(--text-2)}
.paneles.dos{grid-template-columns:1fr 1fr}
@media(max-width:900px){.paneles.dos{grid-template-columns:1fr}}
table.datos.bip td:first-child{color:var(--text-2)}
table.datos td i{font-style:normal;color:var(--text-3);font-size:11px}
.secuencias{display:grid;gap:3px;margin-top:6px}
.sec{display:grid;grid-template-columns:64px 1fr 56px;align-items:center;gap:10px}
.sec .id{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.sec .barra{position:relative;height:15px;background:var(--ink-800);border-radius:4px}
.sec .barra i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--lav)}
.sec .barra i.corta{background:var(--ink-600)}
.sec .barra i.larga{background:var(--teal)}
.sec .barra i.wcs{background:var(--pink)}
.sec .seg{font-family:'Chivo Mono';font-size:12px;text-align:right;color:var(--text-2)}
.franjas{display:grid;gap:5px;margin-top:6px}
.franja{display:grid;grid-template-columns:82px 1fr 62px;align-items:center;gap:11px;font-size:13px}
.franja.ancha{grid-template-columns:190px 1fr 96px}
.franja .n{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.franja .b{position:relative;height:19px;background:var(--ink-800);border-radius:4px}
.franja .b i{position:absolute;left:0;top:0;bottom:0;background:var(--lav);border-radius:4px}
.franja .v{font-family:'Chivo Mono';text-align:right}
.franja .v em{font-style:normal;color:var(--text-3);font-size:11px;margin-left:5px}
/* gráfica de evolución: barras de % BiP con la métrica encima */
.evo{display:flex;align-items:flex-end;gap:10px;height:300px;margin-top:14px;padding:0 4px}
.evo .col{position:relative;flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.evo .barra{width:100%;max-width:64px;background:var(--ink-700);border-radius:5px 5px 0 0}
.evo .punto{position:absolute;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;
  background:var(--teal);box-shadow:0 0 0 3px rgba(110,154,155,.22)}
.evo .dato{position:absolute;left:50%;transform:translateX(-50%);bottom:auto;top:2px;
  font-family:'Chivo Mono';font-size:13px;color:var(--teal)}
.evo .pct{font-family:'Chivo Mono';font-size:12px;color:var(--text-2);margin-top:5px}
.evo .nom{font-size:11px;color:var(--text-3);margin-top:2px;text-align:center;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pasos code{background:var(--ink-800);padding:1px 6px;border-radius:4px;font-family:'Chivo Mono';font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- Jugador: evolución individual ---- */
body.sinSesion #paneles{display:block}
body.sinSesion .panel{margin-bottom:16px}
body.sinSesion #campoFecha{display:none}
#campoJugador{display:none}
body.sinSesion #campoJugador{display:flex}
#fJugador{min-width:160px}
.barraJug{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.segm{display:flex;gap:3px;background:var(--ink-800);border:1px solid var(--ink-700);border-radius:99px;padding:3px}
.segm button{background:none;border:none;height:28px;padding:0 15px;border-radius:99px;font-size:12.5px;color:var(--text-3)}
.segm button.on{background:var(--ink-700);color:var(--text);font-weight:500}
.resumen.cinco{grid-template-columns:repeat(5,1fr)}
@media(max-width:1100px){.resumen.cinco{grid-template-columns:repeat(2,1fr)}}
.kpi.pico{border-left-color:var(--pink)}
.svgJug{width:100%;height:auto;display:block}
.svgJug text{font-family:'Chivo Mono',monospace}
.ptJug{cursor:pointer}
.sw.ln{width:16px;height:2px;border-radius:0}
table.datos.jug td.ses{color:var(--text-2);max-width:260px;overflow:hidden;text-overflow:ellipsis}
table.datos.jug th.minc,table.datos.jug td.minc{background:rgba(160,167,216,.08)}
table.datos.jug td.minc{font-weight:600;color:var(--text)}
table.datos.jug tr.fuera{opacity:.42}
table.datos.jug input{accent-color:#6E9A9B;width:15px;height:15px;cursor:pointer}
.tipoEv{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px;
  background:rgba(160,167,216,.15);color:var(--lav)}
.tipoEv.p{background:rgba(239,181,185,.16);color:var(--pink)}
.tip{position:fixed;pointer-events:none;background:var(--ink-800);border:1px solid var(--ink-600);border-radius:8px;
  padding:8px 11px;font-size:12px;opacity:0;transition:opacity .1s;z-index:50;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tip b{font-family:'Chivo Mono';font-size:13px;display:block}
.tip em{font-style:normal;color:var(--text-3)}

/* ---- Podio de la sesión y promedios en cinco ---- */
.medallas{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:10px}
@media(max-width:620px){.medallas{grid-template-columns:repeat(2,1fr)}}
.medalla{background:var(--ink-850);border:1px solid var(--ink-700);border-radius:10px;padding:8px 9px;
  display:flex;flex-direction:column;min-width:0;overflow:hidden}
.medalla .top{display:flex;align-items:center;gap:8px;margin-bottom:5px;min-height:30px}
.medalla .ico{font-size:22px;line-height:1;width:25px;text-align:center;flex:none}
.medalla .tit{min-width:0}
.medalla .tit b{display:block;font-size:10.5px;font-weight:600;line-height:1.22;letter-spacing:-.01em}
.medalla ol{list-style:none;margin:auto 0 0;padding:0}
.medalla li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:center;gap:5px;
  padding:2px 0;font-size:11px}
.medalla li+li{border-top:1px solid var(--ink-800)}
.medalla li .pos{font-family:'Chivo Mono';font-size:8.5px;color:var(--ink-900);background:var(--ink-600);
  width:14px;height:14px;border-radius:50%;display:grid;place-items:center;font-weight:600}
.medalla li.p1 .pos{background:var(--sand)}
.medalla li.p2 .pos{background:var(--text-2)}
.medalla li.p3 .pos{background:var(--peach)}
.medalla li .qui{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.medalla li.p1 .qui{color:var(--text);font-weight:500}
.medalla li .val{font-family:'Chivo Mono';color:var(--text);font-size:11px;letter-spacing:-.02em}
.larga{display:inline}.corta{display:none}
@media(max-width:1280px){.larga{display:none}.corta{display:inline}}

.resumen.cinco{grid-template-columns:repeat(5,1fr);gap:8px;padding:11px 12px}
@media(max-width:620px){.resumen.cinco{grid-template-columns:repeat(2,1fr)}}
.resumen.cinco .kpi{padding:8px 10px;min-width:0;overflow:hidden;border-radius:9px}
.resumen.cinco .kpi .k{font-size:9px;letter-spacing:.1em;color:var(--text-2);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.resumen.cinco .kpi b{font-size:21px;letter-spacing:-.025em;white-space:nowrap;margin:1px 0}
.resumen.cinco .kpi b i{font-size:11px}
.resumen.cinco .kpi .s{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resumen.cinco .kpi .s em{font-style:normal;color:var(--teal)}
.resumen.cinco .kpi.int .s em{color:var(--lav)}

/* ---- Semáforo, alertas e iconos de la tabla ---- */
table.datos td.n{text-align:center}
table.datos th.n{text-align:center}
.icoMejor{font-size:14px;margin-left:6px;vertical-align:-3px}
.alertaG{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;
  background:var(--sand);color:#3A2F0B;font-size:10px;font-weight:700;margin-left:5px;
  cursor:help;vertical-align:-3px;line-height:1}
.leyTabla{display:flex;gap:15px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--text-3);
  margin-top:12px;padding-top:10px;border-top:1px solid var(--ink-800)}
.leyTabla i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.leyTabla i.sw.verde{background:rgba(110,154,155,.45)}
.leyTabla b{color:var(--text-2)}
.leyPaneles{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:11px;
  color:var(--text-3);margin-top:2px}
.leyPaneles i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.leyPaneles i.raya{width:2px;height:11px;border-radius:0;background:var(--pink)}

/* ---- Paneles de columnas agrupadas por línea ---- */
.paneles{grid-template-columns:1fr}
.panel .cajasMedia{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
.cm{background:var(--ink-800);border-left:3px solid var(--ink-600);border-radius:8px;padding:6px 12px;min-width:102px}
.cm span{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3)}
.cm b{font-family:'Chivo Mono';font-size:16px;letter-spacing:-.02em;font-weight:600;display:block;line-height:1.25}
.cm.eq{background:rgba(239,181,185,.14);border:1px solid rgba(239,181,185,.3);border-left:1px solid rgba(239,181,185,.3)}
.cm.eq b{color:var(--pink);font-size:20px}
svg.cols{width:100%;height:auto;display:block}
svg.cols text{font-family:'Chivo Mono',monospace}
.leyPaneles{grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--text-3);margin-top:2px}

/* ---- Minigráfico en las cajas de promedio ---- */
.resumen.cinco .kpi .chispa{display:block;width:100%;height:32px;margin-top:5px}
.delta{font-family:'Chivo Mono';font-size:10.5px;margin-left:6px}
.delta.sube{color:var(--teal)}
.delta.baja{color:var(--pink)}
.enlace{background:none;border:none;padding:0;height:auto;color:var(--teal);font-size:12px;
  text-decoration:underline;cursor:pointer;font-family:inherit}
.enlace:hover{color:var(--text)}
@media print{
  @page{margin:9mm;size:landscape}
  *{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  body{background:#fff;color:#111;font-size:12px}
  header,nav,aside,.selectores,.leyenda{display:none}
  .app{display:block}
  .soloPdf{display:block;font-size:13px;margin-bottom:6px;color:#111}
  /* las cajas de arriba pierden el degradado, que en papel sale casi negro */
  .kpi{background:#f7f7f7 !important;border:1px solid #bbb;border-left:3px solid #5a8b8c}
  .kpi.int{border-left-color:#7f8bbf}
  .c,.c.dest{background:#f4f4f4 !important;border:1px solid #bbb}
  .panel .selMet{display:none}
  .resumen{grid-template-columns:repeat(4,1fr);gap:6px}
  /* El reporte en papel: podio y promedios arriba, tabla, y los paneles después. */
  .medallas{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:7px;break-inside:avoid}
  .medalla{background:#FBFCFD !important;border:1px solid #D4D8E0;border-radius:7px;padding:6px 8px}
  .medalla .ico{font-size:16px;width:19px}
  .medalla .top{min-height:0;margin-bottom:4px}
  .medalla .tit b{font-size:9px;color:#14161C}
  .larga{display:inline}.corta{display:none}
  .medalla li{font-size:9px;padding:1px 0;grid-template-columns:13px minmax(0,1fr) auto}
  .medalla li+li{border-top:1px solid #EDEFF3}
  .medalla li .pos{width:13px;height:13px;font-size:7.5px;background:#D9DDE4;color:#14161C}
  .medalla li.p1 .pos{background:#E8CF6E}.medalla li.p2 .pos{background:#C3C8D2}
  .medalla li.p3 .pos{background:#E6B795}
  .medalla li .qui{color:#3B414E}.medalla li.p1 .qui{color:#14161C;font-weight:600}
  .medalla li .val{color:#14161C;font-size:9px}
  .resumen.cinco{grid-template-columns:repeat(5,1fr);gap:6px;background:#fff !important;
    border:none;padding:0;margin-bottom:7px;break-inside:avoid}
  .resumen.cinco .kpi{background:#FBFCFD !important;border:1px solid #D4D8E0;border-left:3px solid #5A8B8C;padding:5px 9px}
  .resumen.cinco .kpi.int{border-left-color:#7F8BBF}
  .resumen.cinco .kpi .k{color:#5A6171;font-size:8px}
  .resumen.cinco .kpi b{color:#14161C;font-size:17px}
  .resumen.cinco .kpi b i{color:#5A6171;font-size:10px}
  .resumen.cinco .kpi .s{color:#8A909C;font-size:8.5px}
  .resumen.cinco .kpi .s em{color:#5A8B8C;font-weight:600}
  .resumen.cinco .kpi.int .s em{color:#7F8BBF}
  /* En pantalla la tabla va al final, pero en papel cierra la primera página:
     primero el resumen de la sesión, los paneles después. */
  .wrap{display:flex;flex-direction:column}
  #resumen{order:1}
  #tabla{order:2;break-after:page;page-break-after:always}
  #paneles{order:3}
  .tablon{border:none;padding:0;margin-bottom:0}
  .leyTabla{color:#6B7384;font-size:7.5px;gap:12px;margin-top:6px;padding-top:5px;border-top:1px solid #EDEFF3}
  .leyTabla i{width:8px;height:8px}
  .leyTabla i.sw.verde{background:#D8E8E4}
  .leyTabla b{color:#14161C}
  table.datos td.n.verde{background:#D8E8E4;color:#2F5F60;font-weight:600}
  .icoMejor{font-size:11px;vertical-align:-2px}
  .alertaG{width:12px;height:12px;font-size:8px;background:#E8CF6E;color:#4A3B06}
  .kpi{border:1px solid #ccc;background:#f7f7f7}
  .kpi b{color:#111;font-size:18px}
  .kpi .k,.kpi .s{color:#555}
  .avgline{color:#555}
  .avgline b{color:#a3444d;font-size:15px}
  .wrap{max-width:none;padding:0}
  .cab h2{color:#111;font-size:16px}
  .cab .meta{color:#333}
  .paneles{grid-template-columns:repeat(3,1fr);gap:8px}
  .panel{background:#fff;border:1px solid #bbb;padding:10px 12px;break-inside:avoid;page-break-inside:avoid}
  .panel h3{color:#111;font-size:12px}
  .panel .uni,.caja{color:#555}
  .caja{background:#f2f2f2;padding:4px 6px}
  .caja b{color:#111;font-size:12px}
  .caja.destacada{background:#f7e6e8}
  .caja.destacada b{color:#a3444d}
  .fila{grid-template-columns:88px 1fr 60px;padding:2px 0}
  .fila .nom{color:#222;font-size:11.5px}
  .fila .val{color:#000;font-size:11.5px;font-weight:500}
  .pista{height:13px;background:#e8e8e8}
  .pista i{background:#7f8bbf}
  .pista i.alta{background:#3c4a8a}
  .pista u{background:#c0392b;width:2px}
  table.datos{font-size:10.5px}
  table.datos th,table.datos td{color:#111;border-color:#ddd;padding:2px 4px}
  table.datos td.n.lider{color:#111;font-weight:700}
  table.datos td.n.verde{background:#dceceb}
  /* con 17 columnas hay que apretar para que quepan los impactos */
  .scroll{overflow:visible}
  table.datos{font-size:8.5px;table-layout:auto;width:100%}
  table.datos th{font-size:7.5px;white-space:normal;line-height:1.2}
  table.datos th.grupo{color:#333;background:#eee}
  table.datos.drills td{padding:5px 7px}
  table.datos.drills .nomb{font-size:11px;color:#111}
  table.datos.drills .dur i{background:#bbb}
  table.datos.drills .dur span{color:#555}
  table.datos td.acwr.alta{color:#b03a3a}
  table.datos td.acwr.ok{color:#2f5f60}
  table.datos td.acwr.baja{color:#4a5a8a}
  .tag{border:1px solid #ccc;color:#333;background:#f4f4f4}
  td.chispa i{background:#ccc}
  td.chispa i.ult{background:#5a8b8c}
  .conmuta{display:none}
  /* La pestaña de jugador en papel: fondo claro y todo el texto legible. */
  .barraJug,.tip,table.datos.jug input{display:none}
  .resumen{background:#fff !important;border:none;padding:0}
  .svgJug text{fill:#444}
  .svgJug line[stroke="#1B263B"]{stroke:#e3e3e3}
  .svgJug rect{fill:#9aa3bd !important}
  .svgJug path[fill^="url"]{opacity:.35}
  table.datos.jug tr.fuera{display:none}
  table.datos.jug th.minc,table.datos.jug td.minc{background:#eef0f7}
  table.datos.jug td.minc,table.datos.jug td.ses,table.datos.jug td{color:#111}
  table.datos.jug .tipoEv{background:#ececec;color:#333;border:none}
  table.datos.jug .tipoEv.p{background:#f7e6e8;color:#a3444d}
  .panel .sub{color:#555}
  .panel.ancho{break-inside:auto;page-break-inside:auto}
  .cabPdf{font-size:15px;color:#111;margin-bottom:10px}
  .cabPdf b{font-size:17px}
  .c{background:#f7f7f7;border:1px solid #ccc}
  .c b{color:#111;font-size:17px}
  .c span{color:#555}
  .c.dest{background:#e8f0ef}
  .bip .secc{color:#2f5f60}
  .medalla{background:#f7f7f7;border:1px solid #ddd}
  .medalla .cab b,.medalla li .val,.medalla li.p1 .qui{color:#111}
  .medalla li .qui,.medalla li .nom2{color:#333}
  table.datos.carga td.n i{display:block;font-style:normal;font-size:10.5px;color:var(--text-3);margin-top:2px}
table.datos.carga tfoot tr.media td{border-top:1px solid var(--ink-600);background:rgba(160,167,216,.06);color:var(--lav)}
table.datos th.orden{cursor:pointer;user-select:none}
table.datos th.orden:hover{color:var(--text)}
table.datos.drills td{padding:9px 10px}
table.datos.drills tfoot tr.media td{border-top:1px solid var(--ink-600);background:rgba(160,167,216,.10);color:var(--lav)}
table.datos.drills tfoot .nomb{color:var(--text)}
table.datos.drills tfoot tr.tipico td{background:rgba(110,154,155,.10);color:var(--teal);border-top:none}
table.datos.drills tfoot tr.dif td{background:var(--ink-800);color:var(--text-2);border-top:none}
table.datos.drills .nomb{font-size:14px}
table.datos.drills .dur{display:flex;align-items:center;gap:7px;margin-top:4px}
table.datos.drills .dur i{height:4px;background:var(--ink-600);border-radius:2px;display:block}
table.datos.drills .dur span{font-size:10.5px;color:var(--text-3)}
table.datos td.n.verde{background:#dceceb;color:#2f5f60;font-weight:600}

  table.datos td.pos{color:#555}

  /* Los paneles van al final del bloque de impresión a propósito: así ganan a
     las reglas de arriba. Dos por página, que una columna agrupada necesita
     ancho para que quepan los nombres girados. */
  /* Una columna agrupada necesita el ancho de la hoja, así que van de una en
     una: dos paneles por página. */
  .paneles{grid-template-columns:1fr;gap:7px;align-items:start}
  .panel{padding:7px 10px;background:#fff;border:1px solid #D4D8E0;border-radius:8px}
  .panel h3{font-size:11px;line-height:1.2;color:#14161C}
  .panel .cajasMedia{gap:5px;margin-bottom:7px}
  .cm{background:#F4F6FA !important;border:1px solid #E2E6EE;border-left:3px solid #C9CED8;padding:4px 9px;min-width:88px}
  .cm span{color:#6B7384;font-size:7px}
  .cm b{color:#14161C;font-size:12px}
  .cm.eq{background:#FBF0F1 !important;border:1px solid #EBD3D5}
  .cm.eq b{color:#9C4B52;font-size:14px}
  svg.cols text{fill:#3B414E}
  svg.cols line[stroke="#1B263B"]{stroke:#E6E9EF}
  /* La nota de los paneles se iba sola a una página en blanco al final. */
  .leyPaneles{display:none}
  /* el minigráfico también se imprime */
  .resumen.cinco .kpi .chispa{display:block;height:26px}
  .delta.sube{color:#2F5F60}
  .delta.baja{color:#9C4B52}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="mark">CAU</span><b>Cargas</b></div>
    <nav role="tablist">
      <button class="tab" role="tab" id="tab-reporte" aria-selected="true">Session Analysis</button>
      <button class="tab" role="tab" id="tab-drill" aria-selected="false">Drill Analysis</button>
      <button class="tab" role="tab" id="tab-jugador" aria-selected="false">Jugador</button>
      <button class="tab" role="tab" id="tab-carga" aria-selected="false">% Carga</button>
      <button class="tab" role="tab" id="tab-acwr" aria-selected="false">Carga ACWR</button>
      <button class="tab" role="tab" id="tab-bip" aria-selected="false">BiP</button>
      <button class="tab abajo" role="tab" id="tab-cargar" aria-selected="false">Load Data</button>
    </nav>
    <div id="estado"><span class="dot"></span><span id="estadoTxt">Cargando…</span></div>
  </aside>

  <main>
    <header>
      <div class="ctx">
        <div class="cab" id="cab"></div>
        <div class="ctrl">
          <div class="field"><label for="fSquad">Equipo</label><select id="fSquad"></select></div>
          <div class="field" id="campoFecha"><label for="fFecha">Sesión</label><select id="fFecha"></select></div>
          <div class="field" id="campoJugador"><label for="fJugador">Jugador</label><select id="fJugador"></select></div>
          <button id="btnPdf">Exportar PDF</button>
        </div>
      </div>
    </header>
    <div class="wrap">
      <div id="resumen"></div>
      <div class="selectores" id="selectores"></div>
      <div class="paneles" id="paneles"></div>
      <div id="tabla"></div>
    </div>
  </main>
</div>
<div class="tip" id="tipJug"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
